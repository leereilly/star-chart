name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Generate examples
        run: npm run examples

      - name: Bundle smoke test
        run: npm run test:bundle

      - name: Pack (dry run)
        run: npm pack --dry-run

      - name: Verify dist/ and examples/ are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Committed dist/ or examples/ are out of date.'
            echo 'Run "npm run build && npm run examples" and commit the result.'
            git status --porcelain
            git --no-pager diff -- dist examples action.yml
            exit 1
          fi

  windows:
    name: Filesystem checks (Windows, Node 24)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test
